# Production. All secrets come from the environment; startup fails if one is missing.
spring:
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10s
      max-lifetime: 30m

server:
  forward-headers-strategy: native
  shutdown: graceful

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

paisatrack:
  security:
    jwt:
      secret: ${JWT_SECRET}
      allow-ephemeral-secret: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
