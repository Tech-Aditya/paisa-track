# Settings shared by every environment. Environment-specific values live in
# application-dev.yml (default, local runs) and application-prod.yml.
spring:
  application:
    name: paisatrack
  banner:
    location: classpath:banner.txt
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true          # browsers revalidate the web app (cheap 304s) so a deploy is never stale
  mvc:
    problemdetails:
      enabled: false              # errors use our ApiResponse envelope
    format:
      date: iso
      time: iso
      date-time: iso

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

# Logback setup per profile is in logback-spring.xml.
# Console: "12:04:31.218  INFO [3f9a1c0d7e2b4a61] UserService : Login succeeded userId=..."
# File:    "2026-10-31 12:04:31.218  INFO [3f9a1c0d7e2b4a61] [user=…] c.p.modules.user.UserService : Login succeeded ..."
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId:-main}]){faint} %clr(%-22.22logger{0}){cyan} : %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-main}] [user=%X{userId:--}] %-36.36logger{36} : %m%n%wEx"
  level:
    root: INFO
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.springframework.data.repository.config: WARN
    org.springframework.data.jpa: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.security: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN

paisatrack:
  version: "@project.version@"
  public-url: ${APP_PUBLIC_URL:}  # public address, shown in the startup summary (e.g. https://paisatrack.example.com)
  logging:
    slow-request-threshold: 1s    # requests slower than this are logged at WARN
  security:
    jwt:
      issuer: paisatrack
      audience: paisatrack-api
      secret: ${JWT_SECRET:}
      allow-ephemeral-secret: false
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    refresh-token-cleanup:
      cron: "0 30 3 * * *"
      retention: 7d
    rate-limit:
      enabled: true
      auth:
        max-requests: 10
        window: 1m
  idempotency:
    retention: 7d
    cleanup-cron: "0 45 3 * * *"
  recurring:
    generation-cron: "0 0 * * * *"        # hourly: expected occurrences ahead of time
  notifications:
    cron: "0 10 * * * *"                  # hourly: reminders, in each user's timezone
  cors:
    allowed-origins: []
